spring:
  application:
    name: walletflow-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/walletflow}
    username: ${DB_USERNAME:walletflow}
    password: ${DB_PASSWORD:walletflow}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        walletflow.transfer.duration: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  jwt:
    # Base64 HMAC key. The default is for local development only; always set JWT_SECRET in real deployments.
    secret: ${JWT_SECRET:ZGV2LW9ubHktd2FsbGV0Zmxvdy1qd3Qtc2VjcmV0LWNoYW5nZS1tZS0yMDI2IQ==}
    issuer: walletflow-api
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
  admin:
    email: ${ADMIN_EMAIL:admin@walletflow.dev}
    password: ${ADMIN_PASSWORD:}
