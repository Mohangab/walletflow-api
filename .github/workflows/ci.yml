name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: mvn verify (H2 + Redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build, unit + integration tests
        run: ./mvnw -B verify
        env:
          REDIS_HOST: localhost

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-h2
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

  postgres:
    name: mvn verify (PostgreSQL 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: walletflow
          POSTGRES_USER: walletflow
          POSTGRES_PASSWORD: walletflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U walletflow" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Same test suite, but against a real PostgreSQL (row locks, constraints, Flyway SQL).
      - name: Integration tests on PostgreSQL
        run: ./mvnw -B verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/walletflow
          SPRING_DATASOURCE_USERNAME: walletflow
          SPRING_DATASOURCE_PASSWORD: walletflow
          REDIS_HOST: localhost

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-postgres
          path: target/failsafe-reports/
          if-no-files-found: ignore

  docker:
    name: Docker build + Compose smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: walletflow-api:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start stack
        run: docker compose up -d --no-build

      - name: Smoke test the running stack
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            curl -sf localhost:8080/actuator/health/readiness && break
            sleep 2
          done
          curl -sf localhost:8080/actuator/health/readiness

          H=localhost:8080/api/v1
          curl -sf -X POST $H/auth/register -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"Passw0rd!23","fullName":"CI"}'
          TOKEN=$(curl -sf -X POST $H/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"Passw0rd!23"}' | jq -r .accessToken)
          WALLET=$(curl -sf -X POST $H/wallets -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' -d '{"currency":"INR"}' | jq -r .id)
          curl -sf -X POST $H/wallets/$WALLET/deposits -H "Authorization: Bearer $TOKEN" \
            -H 'Idempotency-Key: ci-dep-1' -H 'Content-Type: application/json' -d '{"amount":"100.00"}' | jq .
          curl -sf $H/wallets/$WALLET -H "Authorization: Bearer $TOKEN" | jq -e '.balance == 100'

          ADMIN=$(curl -sf -X POST $H/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"admin@walletflow.dev","password":"Admin#12345"}' | jq -r .accessToken)
          curl -sf $H/admin/reconciliation -H "Authorization: Bearer $ADMIN" | jq -e '.healthy == true'

          curl -sf localhost:8080/actuator/prometheus | grep -q walletflow_reconciliation_healthy

      - name: Check Prometheus scrape target and Grafana dashboard
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            HEALTH=$(curl -sf localhost:9090/api/v1/targets | jq -r '.data.activeTargets[0].health' || true)
            [ "$HEALTH" = "up" ] && break
            sleep 2
          done
          test "$HEALTH" = "up"
          for i in $(seq 1 30); do
            curl -sf -u admin:admin localhost:3000/api/dashboards/uid/walletflow-overview > /dev/null && break
            sleep 2
          done
          curl -sf -u admin:admin localhost:3000/api/dashboards/uid/walletflow-overview | jq -r .dashboard.title

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
